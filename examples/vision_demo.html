<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vision-Oriented Member Search Demo</title>
    <style>
      body { font-family: sans-serif; margin: 2rem; background: #f4f7fb; }
      .card { max-width: 560px; padding: 1.25rem; border-radius: 12px; background: white; box-shadow: 0 8px 24px rgba(0,0,0,0.08); }
      .field-label { font-size: 0.9rem; color: #555; margin-bottom: 0.25rem; }
      .field-shell { border: 1px solid #ccd5e1; border-radius: 10px; padding: 0.75rem; background: #fbfdff; }
      .cta { margin-top: 1rem; background: #0b63f6; color: white; border: none; border-radius: 10px; padding: 0.85rem 1rem; font-size: 1rem; width: 100%; cursor: pointer; }
      .result { margin-top: 1rem; padding: 1rem; border-radius: 10px; background: #f7f9fc; }
      .result strong { display: inline-block; min-width: 90px; }
      input { width: 100%; border: none; outline: none; font-size: 1rem; background: transparent; }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Member Lookup</h1>
      <p>Use the member number to reveal the current balance.</p>

      <div class="field-label">Member number</div>
      <div class="field-shell">
        <input type="text" aria-label="Member number" />
      </div>

      <button class="cta">Reveal balance</button>

      <div class="result">
        <div><strong>Status</strong><span data-role="status-text">Not searched yet</span></div>
        <div><strong>Balance</strong><span data-role="balance-text">--</span></div>
      </div>
    </div>

    <script>
      const fakeDb = {
        '12345': 'USD 2,500',
        '67890': 'USD 990'
      };

      const input = document.querySelector('input[aria-label="Member number"]');
      const button = document.querySelector('button.cta');
      const statusText = document.querySelector('[data-role="status-text"]');
      const balanceText = document.querySelector('[data-role="balance-text"]');

      button.addEventListener('click', () => {
        const memberId = input.value.trim();
        statusText.textContent = 'Search completed';
        balanceText.textContent = fakeDb[memberId] || 'USD 0';
      });
    </script>
  </body>
</html>
